    const stepIndicatorEl = document.getElementById("wgra-budget-step-indicator");
    const mainCardEl = document.getElementById("wgra-budget-main-card");

    const gameState = {
      step: 1,
      profileId: null,
      income: 0,
      categoryValues: {},
      totalAllocated: 0,
      savingsAmount: 0,
      baseScore: 70,
      budgetScoreDelta: 0,
      eventScoreDelta: 0,      // cumulative over all questions
      eventSequence: [],
      questionIndex: 0,
      notes: {
        budget: [],
        event: []
      }
    };
    
        // Prevent auto-scroll until the user interacts
    let userInteracted = false;
    ["click","touchstart","keydown","wheel"].forEach(evt => {
      window.addEventListener(
        evt,
        () => { userInteracted = true; },
        { once: true, passive: true }
      );
    });

        function smoothScrollTo(el) {
      if (!userInteracted) return; // stops the initial “drop”
      if (!el) return;
      const rect = el.getBoundingClientRect();
      const offset = rect.top + window.scrollY - 120;
      window.scrollTo({ top: offset, behavior: "smooth" });
    }

    function formatMoney(num) {
      return "$" + num.toLocaleString("en-US", { maximumFractionDigits: 0 });
    }

    function updateStepIndicator() {
      if (gameState.step === 1) {
        stepIndicatorEl.textContent = "Step 1 of 3 — Choose a profile and monthly income";
      } else if (gameState.step === 2) {
        stepIndicatorEl.textContent = "Step 2 of 3 — Build your monthly budget";
      } else if (gameState.step === 3) {
        const qNum = gameState.questionIndex + 1;
        stepIndicatorEl.textContent = "Step 3 — Money curveball " + qNum + " of " + TOTAL_QUESTIONS;
      } else {
        stepIndicatorEl.textContent = "Budget Builder Quest™ — Results";
      }
    }

    function renderStep1() {
      gameState.step = 1;
      updateStepIndicator();

      let profileCardsHtml = PROFILES.map(p => {
        return `
          <div class="wgra-budget-profile-card" data-profile-id="${p.id}">
            <p class="wgra-budget-profile-name">${p.name}</p>
            <p class="wgra-budget-profile-income">Suggested take-home: ${formatMoney(p.income)}/month</p>
            <p class="wgra-budget-profile-desc">${p.desc}</p>
          </div>
        `;
      }).join("");

      const incomeValue = gameState.income || "";

      mainCardEl.innerHTML = `
        <div>
          <h3 class="wgra-budget-section-title">Pick a starting scenario</h3>
          <p class="wgra-budget-section-copy">
            Choose the profile that feels closest to you right now — or just pick one to practice.
            You can also adjust the monthly take-home income below.
          </p>

          <div class="wgra-budget-profiles">
            ${profileCardsHtml}
          </div>

          <div class="wgra-budget-income-row">
            <label for="wgra-budget-income-input">Monthly take-home income:</label>
            <input id="wgra-budget-income-input" class="wgra-budget-income-input" type="number" min="500" step="50" value="${incomeValue}" />
          </div>
          <div class="wgra-budget-income-note">
            Take-home income is the amount that actually lands in your bank account after taxes and deductions.
          </div>

          <div class="wgra-budget-controls">
            <div class="wgra-budget-controls-left">
              <button class="wgra-budget-btn-secondary" id="wgra-budget-reset-game">Reset</button>
            </div>
            <div class="wgra-budget-controls-right">
              <button class="wgra-budget-btn" id="wgra-budget-step1-next" disabled>Start building my budget</button>
            </div>
          </div>
        </div>
      `;

      const profileEls = mainCardEl.querySelectorAll(".wgra-budget-profile-card");
      const incomeInput = document.getElementById("wgra-budget-income-input");
      const nextBtn = document.getElementById("wgra-budget-step1-next");
      const resetBtn = document.getElementById("wgra-budget-reset-game");

      profileEls.forEach(el => {
        el.addEventListener("click", () => {
          const id = el.getAttribute("data-profile-id");
          const profile = PROFILES.find(p => p.id === id);
          if (!profile) return;

          gameState.profileId = id;
          gameState.income = profile.income;

          incomeInput.value = profile.income;

          profileEls.forEach(pEl => pEl.classList.remove("wgra-selected"));
          el.classList.add("wgra-selected");

          nextBtn.disabled = false;
        });
      });

      incomeInput.addEventListener("input", () => {
        const val = parseFloat(incomeInput.value || "0");
        if (val >= 500) {
          gameState.income = val;
          nextBtn.disabled = false;
        } else {
          gameState.income = 0;
          nextBtn.disabled = true;
        }
      });

      nextBtn.addEventListener("click", () => {
        if (gameState.income >= 500) {
          renderStep2();
        }
      });

      resetBtn.addEventListener("click", () => {
        resetGame();
      });

      if (gameState.income >= 500) {
        nextBtn.disabled = false;
        profileEls.forEach(el => {
          if (el.getAttribute("data-profile-id") === gameState.profileId) {
            el.classList.add("wgra-selected");
          }
        });
      }

      smoothScrollTo(document.getElementById("wgra-budget-game-root"));
    }

    function renderStep2() {
      gameState.step = 2;
      updateStepIndicator();

      if (!gameState.income || gameState.income < 500) {
        gameState.income = 2600;
      }

      if (Object.keys(gameState.categoryValues).length === 0) {
        CATEGORIES.forEach(cat => {
          gameState.categoryValues[cat.id] = Math.round(gameState.income * cat.defaultPct);
        });
      }

      const rowsHtml = CATEGORIES.map(cat => {
        const value = gameState.categoryValues[cat.id] || 0;
        const pct = (value / gameState.income) * 100 || 0;
        return `
          <div class="wgra-budget-category-label">
            <div>${cat.label}</div>
            <div class="wgra-budget-category-hint">${cat.hint}</div>
          </div>
          <div>
            <input type="number" class="wgra-budget-number-input" min="0" step="10"
              data-cat-id="${cat.id}" value="${value}">
          </div>
          <div class="wgra-budget-percentage" data-cat-pct="${cat.id}">
            ${pct.toFixed(1)}%
          </div>
        `;
      }).join("");

      mainCardEl.innerHTML = `
        <div>
          <h3 class="wgra-budget-section-title">Build your base monthly budget</h3>
          <p class="wgra-budget-section-copy">
            Use your take-home income to give every dollar a job. The goal is to cover essentials, protect savings,
            and give fun money a clear limit.
          </p>

          <p class="wgra-budget-income-note">
            Monthly take-home income: <strong>${formatMoney(gameState.income)}</strong>
          </p>

          <div class="wgra-budget-grid">
            <div class="wgra-budget-grid-header">Category</div>
            <div class="wgra-budget-grid-header">Amount</div>
            <div class="wgra-budget-grid-header" style="text-align:right;">% of income</div>

            ${rowsHtml}
          </div>

          <div class="wgra-budget-summary-row">
            <div>
              <span>Total allocated:</span>
              <strong id="wgra-budget-total-allocated"></strong>
              <span> / ${formatMoney(gameState.income)}</span>
            </div>
            <div class="wgra-budget-summary-status" id="wgra-budget-summary-status"></div>
          </div>

          <div class="wgra-budget-hints">
            Aim for at least 10% toward savings and investing when possible. If money is tight, even 1–5% builds the
            habit — the amount can grow later.
          </div>

          <div class="wgra-budget-alert" id="wgra-budget-alert"></div>

          <div class="wgra-budget-controls">
            <div class="wgra-budget-controls-left">
              <button class="wgra-budget-btn-secondary" id="wgra-budget-step2-back">Back</button>
            </div>
            <div class="wgra-budget-controls-right">
              <button class="wgra-budget-btn" id="wgra-budget-step2-next">Lock in this budget</button>
            </div>
          </div>
        </div>
      `;

      const inputs = mainCardEl.querySelectorAll(".wgra-budget-number-input");
      const totalAllocatedEl = document.getElementById("wgra-budget-total-allocated");
      const statusEl = document.getElementById("wgra-budget-summary-status");
      const alertEl = document.getElementById("wgra-budget-alert");
      const backBtn = document.getElementById("wgra-budget-step2-back");
      const nextBtn = document.getElementById("wgra-budget-step2-next");

      function recalcTotals() {
        let total = 0;
        inputs.forEach(inp => {
          const id = inp.getAttribute("data-cat-id");
          const val = parseFloat(inp.value || "0");
          gameState.categoryValues[id] = isNaN(val) ? 0 : val;
          total += gameState.categoryValues[id];
        });

        gameState.totalAllocated = total;
        totalAllocatedEl.textContent = formatMoney(total);

        const diff = gameState.income - total;
        const diffAbs = Math.abs(diff);

        statusEl.classList.remove("wgra-ok", "wgra-bad");
        alertEl.textContent = "";

        if (diff === 0) {
          statusEl.textContent = "Every dollar has a job. Nice.";
          statusEl.classList.add("wgra-ok");
        } else if (diff > 0) {
          statusEl.textContent = "You still have " + formatMoney(diff) + " unassigned.";
          statusEl.classList.add("wgra-ok");
        } else {
          statusEl.textContent = "You are over budget by " + formatMoney(diffAbs) + ".";
          statusEl.classList.add("wgra-bad");
        }

        CATEGORIES.forEach(cat => {
          const amt = gameState.categoryValues[cat.id] || 0;
          const pctEl = mainCardEl.querySelector('[data-cat-pct="' + cat.id + '"]');
          if (pctEl) {
            const pct = (amt / gameState.income) * 100 || 0;
            pctEl.textContent = pct.toFixed(1) + "%";
          }
        });
      }

      inputs.forEach(inp => {
        inp.addEventListener("input", recalcTotals);
      });

      recalcTotals();

      backBtn.addEventListener("click", () => {
        renderStep1();
      });

      nextBtn.addEventListener("click", () => {
        recalcTotals();

        const diff = gameState.income - gameState.totalAllocated;
        if (diff < -1) {
          alertEl.textContent = "You’re spending more than you bring in. Trim categories until you’re at or below your income.";
          return;
        }

        evaluateBudget();
        startQuestionPhase();
      });

      smoothScrollTo(document.getElementById("wgra-budget-game-root"));
    }

    function evaluateBudget() {
      const housing = gameState.categoryValues["housing"] || 0;
      const food = gameState.categoryValues["food"] || 0;
      const transport = gameState.categoryValues["transport"] || 0;
      const debt = gameState.categoryValues["debt"] || 0;
      const savings = gameState.categoryValues["savings"] || 0;
      const fun = gameState.categoryValues["fun"] || 0;

      gameState.savingsAmount = savings;

      const income = gameState.income || 1;

      const savingsPct = (savings / income) * 100;
      const essentialsPct = ((housing + food + transport + debt) / income) * 100;
      const funPct = (fun / income) * 100;

      let delta = 0;
      const notes = [];

      if (savingsPct >= 20) {
        delta += 12;
        notes.push("You’re sending a strong " + savingsPct.toFixed(1) + "% to savings/investing — future you approves.");
      } else if (savingsPct >= 10) {
        delta += 8;
        notes.push("You’re hitting the classic 10%+ savings guideline. Great habit building.");
      } else if (savingsPct >= 5) {
        delta += 3;
        notes.push("You’re starting with " + savingsPct.toFixed(1) + "% to savings. Small consistent amounts still build momentum.");
      } else if (savingsPct > 0) {
        delta -= 3;
        notes.push("Savings is under 5%. If possible, try to slowly move dollars from fun into savings over time.");
      } else {
        delta -= 8;
        notes.push("No money is going to savings yet. Even $10–$20 a month can start your safety net.");
      }

      if (essentialsPct <= 70) {
        delta += 6;
        notes.push("Essentials are at about " + essentialsPct.toFixed(1) + "% of income — that leaves breathing room for goals.");
      } else if (essentialsPct <= 85) {
        notes.push("Essentials take about " + essentialsPct.toFixed(1) + "% of income. It’s workable, but raises the stakes on tracking.");
      } else {
        delta -= 6;
        notes.push("Essentials are eating " + essentialsPct.toFixed(1) + "% of income. Housing, food, or debt may need longer-term adjustments.");
      }

      if (funPct <= 15) {
        delta += 4;
        notes.push("Fun money is at " + funPct.toFixed(1) + "% — you’re keeping lifestyle creep under control.");
      } else if (funPct <= 25) {
        notes.push("Fun is around " + funPct.toFixed(1) + "% of income. Enjoy life, but keep an eye on subscriptions and impulse buys.");
      } else {
        delta -= 4;
        notes.push("Fun and lifestyle are " + funPct.toFixed(1) + "% of income. Trimming here can free up savings or debt payoff power.");
      }

      if (debt > 0) {
        notes.push("You’ve scheduled money for debt payments — that keeps accounts current and protects your credit.");
      } else {
        notes.push("You reported no debt payments. If that’s accurate, you’ve got more flexibility to direct money toward savings and goals.");
      }

      gameState.budgetScoreDelta = delta;
      gameState.notes.budget = notes;
    }

    function startQuestionPhase() {
      // Build a randomized sequence of events, repeating if needed to reach 5
      const shuffled = EVENTS.slice().sort(() => Math.random() - 0.5);
      const sequence = [];
      let i = 0;
      while (sequence.length < TOTAL_QUESTIONS) {
        sequence.push(shuffled[i % shuffled.length]);
        i++;
      }
      gameState.eventSequence = sequence;
      gameState.questionIndex = 0;
      gameState.eventScoreDelta = 0;
      gameState.notes.event = [];
      renderQuestion();
    }

    function renderQuestion() {
      gameState.step = 3;
      updateStepIndicator();

      const event = gameState.eventSequence[gameState.questionIndex];
      const projectedScore = gameState.baseScore + gameState.budgetScoreDelta + gameState.eventScoreDelta;

      const budgetNotesList = gameState.notes.budget.map(n => "<li>" + n + "</li>").join("");

      const isLast = (gameState.questionIndex === TOTAL_QUESTIONS - 1);
      const buttonLabel = isLast ? "See my Money Health Score" : "Next question";

      mainCardEl.innerHTML = `
        <div>
          <h3 class="wgra-budget-section-title">Your budget is locked in — now life throws a curveball</h3>
          <p class="wgra-budget-section-copy">
            Based on your choices so far, your Money Health Score is trending around:
            <span style="color:${projectedScore >= 75 ? 'var(--wgra-alert-good)' : 'var(--wgra-gold-soft)'}; font-weight:700;">
              ${projectedScore}/100
            </span>
            before this question.
          </p>

          <div class="wgra-budget-event-box">
            <div class="wgra-budget-event-title">${event.title}</div>
            <div class="wgra-budget-event-text">
              ${event.text}
            </div>

            <div class="wgra-budget-event-options" id="wgra-budget-event-options">
              ${event.options.map(o => `
                <button class="wgra-budget-event-option" data-option-id="${o.id}">
                  ${o.label}
                </button>
              `).join("")}
            </div>

            <div class="wgra-budget-event-feedback" id="wgra-budget-event-feedback"></div>
          </div>

          <div>
            <p class="wgra-budget-section-title" style="font-size:17px; margin-top:8px;">Quick reflection on your budget</p>
            <ul class="wgra-budget-final-list">
              ${budgetNotesList}
            </ul>
          </div>

          <div class="wgra-budget-controls">
            <div class="wgra-budget-controls-left">
              <button class="wgra-budget-btn-secondary" id="wgra-budget-step3-back">Back to budget</button>
            </div>
            <div class="wgra-budget-controls-right">
              <button class="wgra-budget-btn" id="wgra-budget-next-question" disabled>${buttonLabel}</button>
            </div>
          </div>
        </div>
      `;

      const optionsEl = document.getElementById("wgra-budget-event-options");
      const feedbackEl = document.getElementById("wgra-budget-event-feedback");
      const backBtn = document.getElementById("wgra-budget-step3-back");
      const nextBtn = document.getElementById("wgra-budget-next-question");

      let answered = false;

      optionsEl.querySelectorAll(".wgra-budget-event-option").forEach(btn => {
        btn.addEventListener("click", () => {
          if (answered) return; // lock in first answer only
          answered = true;

          optionsEl.classList.add("wgra-locked");
          optionsEl.querySelectorAll(".wgra-budget-event-option").forEach(b => b.classList.remove("wgra-selected"));

          const optionId = btn.getAttribute("data-option-id");
          const chosen = event.options.find(o => o.id === optionId);
          if (!chosen) return;

          btn.classList.add("wgra-selected");
          gameState.eventScoreDelta += chosen.impact;

          const label = chosen.impact >= 0 ? "Solid move" : "Risky move";

          feedbackEl.innerHTML = "<strong>" + label + "</strong> — " + chosen.explanation;
          gameState.notes.event.push(label + ": " + chosen.explanation);

          nextBtn.disabled = false;

          // Drop screen to show feedback clearly
          smoothScrollTo(feedbackEl);
        });
      });

      backBtn.addEventListener("click", () => {
        renderStep2();
      });
      

      nextBtn.addEventListener("click", () => {
        if (!answered) return;
        if (isLast) {
          renderFinal();
        } else {
          gameState.questionIndex++;
          renderQuestion();
        }
      });

      smoothScrollTo(document.getElementById("wgra-budget-game-root"));
    }

    function renderFinal() {
      gameState.step = 4;
      updateStepIndicator();

      const finalScore = gameState.baseScore + gameState.budgetScoreDelta + gameState.eventScoreDelta;
      const clampedScore = Math.max(0, Math.min(100, finalScore));

      let message;
      if (clampedScore >= 90) {
        message = "You’re running a championship-level budget. The habits you practice here can power real-world wealth.";
      } else if (clampedScore >= 75) {
        message = "You’ve built a strong foundation. A few tweaks — especially around savings and big fixed costs — can push you into elite territory.";
      } else if (clampedScore >= 60) {
        message = "You’re heading in the right direction. Tighten your plan, protect savings, and keep practicing smarter choices.";
      } else {
        message = "Budgets are skills, not personality tests. Every round you play is training your eye for better money decisions.";
      }

      const allNotes = []
        .concat(gameState.notes.budget || [])
        .concat(gameState.notes.event || []);

      const notesList = allNotes.map(n => "<li>" + n + "</li>").join("");

      mainCardEl.innerHTML = `
        <div>
          <h3 class="wgra-budget-section-title">Your Budget Builder Quest™ results</h3>

          <div style="text-align:center; margin-bottom:14px;">
            <div class="wgra-budget-score-badge">
              Money Health Score: ${clampedScore}/100
            </div>
            <p class="wgra-budget-final-copy">${message}</p>
          </div>

          <p class="wgra-budget-section-title" style="font-size:17px; margin-top:4px;">Highlights from this round</p>
          <ul class="wgra-budget-final-list">
            ${notesList}
          </ul>

          <div class="wgra-budget-end-message">
            Every time you replay with different numbers or choices, you’re training your real-life budgeting instincts.
          </div>

          <div class="wgra-budget-controls" style="margin-top:20px;">
            <div class="wgra-budget-controls-left">
              <button class="wgra-budget-btn-secondary" id="wgra-budget-play-again">Play again with a new budget</button>
            </div>
            <div class="wgra-budget-controls-right">
              <button class="wgra-budget-btn" id="wgra-budget-go-to-games">Explore other games</button>
            </div>
          </div>
        </div>
      `;

      const playAgainBtn = document.getElementById("wgra-budget-play-again");
      const gamesBtn = document.getElementById("wgra-budget-go-to-games");

      playAgainBtn.addEventListener("click", () => {
        resetGame(false);
      });

      gamesBtn.addEventListener("click", () => {
        window.location.href = "https://thewealthgapresolutionalgorithm.org/games/";
      });

      smoothScrollTo(document.getElementById("wgra-budget-game-root"));
    }

    function resetGame(fullReset = true) {
      gameState.step = 1;
      gameState.categoryValues = {};
      gameState.totalAllocated = 0;
      gameState.savingsAmount = 0;
      gameState.budgetScoreDelta = 0;
      gameState.eventScoreDelta = 0;
      gameState.eventSequence = [];
      gameState.questionIndex = 0;
      gameState.notes.budget = [];
      gameState.notes.event = [];

      if (fullReset) {
        gameState.profileId = null;
        gameState.income = 0;
      }

      renderStep1();
    }

    // Start game
    resetGame(false);
  })();
</script>
